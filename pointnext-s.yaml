model:
  NAME: BaseSeg

  encoder_args:
    NAME: PointNextEncoder
    width: 32
    blocks: [1,1,1,1,1]
    strides: [1,4,4,4,4]
    sa_layers: 2
    sa_use_res: True
    expansion: 4

    in_channels: 4

    radius: 0.1
    nsample: 32

    aggr_args:
      feature_type: dp_fj
      reduction: max

    group_args:
      NAME: ballquery
      normalize_dp: True

    conv_args:
      order: conv-norm-act

    act_args:
      act: relu

    norm_args:
      norm: bn

  decoder_args:
    NAME: PointNextDecoder

  cls_args:
    NAME: SegHead
    num_classes: 2